<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #1f2c44, #0d1b2a);
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .left {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            backdrop-filter: blur(10px);
        }

        .signup-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .right {
            width: 60%;
            background: url(https://media.istockphoto.com/id/484896606/photo/apple-pie.webp?a=1&b=1&s=612x612&w=0&k=20&c=ufDReAnq_V9PDgVAShkxZ8mcppAS5wymitV4xr_dbMo=) no-repeat center;
            background-size: cover;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        a {
            color: #00c6ff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LEFT FORM -->
    <div class="left">
        <div class="signup-box">
            <h2>Sign Up</h2>

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>

            <div class="link">
                Already have account? <a href="/login/">Login</a>
            </div>
        </div>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="right"></div>

</div>

</body>
</html>
