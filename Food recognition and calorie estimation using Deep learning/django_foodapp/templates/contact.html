{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f8ff;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 60px;
            background: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }

        .menu a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
        }

        /* MAIN */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .card {
            display: flex;
            width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* LEFT SIDE */
        .left {
            width: 40%;
            padding: 30px;
            text-align: center;
        }

        .left img {
            width: 150px;
        }

        .left h2 {
            margin-top: 20px;
        }

        .info {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        /* RIGHT SIDE */
        .right {
            width: 60%;
            padding: 30px;
            background: #fafcff;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">FOOD DL</div>
    <div class="menu">
       <a href="/contact/">Contact</a>
       <a href="/home/">Home</a>
       <a href="/about/">About</a>
    </div>
</div>

<!-- CONTACT SECTION -->
<div class="container">

    <div class="card">

        <!-- LEFT -->
        <div class="left">
            <img src="https://images.unsplash.com/photo-1562059390-a761a084768e?q=80&w=1119&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
            <h2>Contact Us</h2>
            <div class="info">
                📞 +91 7200310872 <br><br>
                ✉ varshagk45@gmail.com<br><br>
                📍  Vellore
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <form method="POST">
                {% csrf_token %}
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
                <input type="email" placeholder="Your Email Address" required>
                <textarea rows="5" placeholder="Message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
